.sun-control.is-on .sun-ray,.path-sun.is-on .sun-ray,.gm-sun-badge.is-on .sun-ray{animation:ray-shine 5.2s linear infinite;animation-delay:calc(var(--i) * .085s)}
.sun-control.is-connecting .sun-ray,.gm-sun-badge.is-connecting .sun-ray{animation:ray-shine 2.2s linear infinite;animation-delay:calc(var(--i) * .06s)}

@keyframes ray-shine{0%,14%,100%{opacity:.52}24%,42%{opacity:1}}
.path-stop.kurd-stop{position:relative}
.path-stop.kurd-stop .path-label{margin-top:4px}
.path-sun{position:relative;display:grid;place-items:center;width:30px;height:30px;color:var(--sun-off)}
.path-sun .kurd-sun-svg{width:26px;height:26px}
.network-path.live .path-sun{color:var(--sun)}
.network-path.live .path-line{background:linear-gradient(to right, rgba(47,126,76,.42), rgba(216,161,21,.34), rgba(47,126,76,.42))}
.home-sun-wrap{display:flex;align-items:center;justify-content:flex-end}
.gm-hero{position:relative}
.gm-sun-holder{display:flex;justify-content:center;margin-bottom:22px}
.gm-sun-badge{position:relative;display:grid;place-items:center;width:132px;height:132px;border-radius:50%;border:1px solid var(--line);color:var(--sun-off);background:transparent;transition:all .2s var(--ease)}
.gm-sun-badge .kurd-sun-svg{width:88px;height:88px}
.gm-sun-badge.is-on{color:var(--sun);border-color:rgba(214,161,21,.34)}
.gm-sun-badge.is-connecting{color:var(--sun);border-color:rgba(214,161,21,.3)}
.gm-sun-badge.is-error{color:var(--error);border-color:rgba(184,75,72,.3)}
.gm-sun-action{width:100%;display:flex;align-items:center;justify-content:center;gap:18px;border-radius:18px;border:1px solid var(--line);padding:20px 22px;background:transparent;color:var(--fg);min-height:112px;text-align:left;font-size:24px;font-weight:650;letter-spacing:-.03em;line-height:1.2;position:relative;transition:transform .18s var(--ease),border-color .18s var(--ease),background .18s var(--ease)}
.gm-sun-action:active{transform:scale(.992)}
.gm-sun-action .gm-sun-inline{flex:none;position:relative;display:grid;place-items:center;width:86px;height:86px;border-radius:50%;border:1px solid var(--line);color:var(--sun-off);background:rgba(255,255,255,.02)}
.gm-sun-action .gm-sun-inline .kurd-sun-svg{width:56px;height:56px}
.gm-sun-action.is-on .gm-sun-inline,.gm-sun-action.is-off .gm-sun-inline,.gm-sun-action.is-on,.gm-sun-action.is-off{border-color:var(--line)}
.gm-sun-action.is-on .gm-sun-inline{color:var(--sun);border-color:rgba(214,161,21,.34)}
.gm-sun-action.is-on .gm-sun-inline::after{content:'';position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle, rgba(254,189,17,.16) 0, rgba(254,189,17,0) 72%)}
.gm-sun-action.is-off .gm-sun-inline{color:var(--sun-off)}
.gm-sun-action .gm-sun-copy{display:flex;flex-direction:column;gap:4px}
.gm-sun-action .gm-sun-label{font-size:25px;font-weight:680;letter-spacing:-.04em}
.gm-sun-action .gm-sun-note{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0}
.gm-bottom .btn.replaced{display:none}
.gm-bottom .gm-sun-action+.btn,.gm-bottom .gm-sun-action+.btn.outline{margin-top:10px}
.icon-button.primary-icon,.profile-filterbar .chip.selected,.chip.selected{color:var(--accent)}
.profile-filterbar .chip.selected,.chip.selected{background:var(--tint)}

/dt><dd>Not yet confirmed</dd></div></dl><div class=\"spacer\"></div><div class=\"note \"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div><strong>Trust is a separate decision</strong>A valid signature does not tell you whether this is the owner you intended. Compare the deployment fingerprint.</div></div><div class=\"footer-actions\"><button class=\"btn\" data-go=\"trust-fingerprint\" >Review deployment fingerprint</button><button class=\"btn link\" data-go=\"import-methods\" >Cancel</button></div>","back":"import-methods","active":"profiles","grandma":false,"connected":null,"sources":["android/core/ui/src/main/res/values/strings.xml"],"sheet":""},{"id":"trust-fingerprint","name":"Trust · Deployment fingerprint","group":"Trust","html":"<h1 class=\"page-title\">Deployment<br>fingerprint</h1><p class=\"page-subtitle\">Compare the full value with the owner.</p><div class=\"fingerprint\">406E 69F0 012D 013D\n04FA F85E 77C8 93B5\n42A8 420B FFEE 564B\nBE86 E8E1 7263 111A</div><p class=\"body-copy\">This node and its keys are controlled by the person who gave you this profile, not by Kurdistan VPN. Compare the deployment fingerprint with them before trusting it.</p><label class=\"check-row\"><input type=\"checkbox\" id=\"trust-check\"><span>I compared the full fingerprint with the deployment owner.</span></label><div class=\"spacer\"></div><div class=\"footer-actions\"><button class=\"btn\" data-action=\"confirm-trust\" disabled id=\"confirm-trust\">Confirm deployment trust</button><button class=\"btn link\" data-go=\"import-methods\" >Cancel</button></div><p class=\"repo-note\">Illustrative fingerprint · never use as a trust anchor</p>","back":"import-preview","active":"profiles","grandma":false,"connected":null,"sources":["android/core/ui/src/main/res/values/strings.xml"],"sheet":""},{"id":"import-confirm","name":"Trust · Confirm encrypted storage","group":"Trust","html":"<h1 class=\"page-title\">Store this profile?</h1><span class=\"state-tag \"><span class=\"dot\"></span>Deployment trust confirmed</span><div style=\"height:25px\"></div><dl class=\"data-list\"><div class=\"data-row\"><dt>Profile</dt><dd>Home</dd></div><div class=\"data-row\"><dt>Generation</dt><dd class=\"mono\">12</dd></div><div class=\"data-row\"><dt>Protocol</dt><dd>Kurd</dd></div><div class=\"data-row\"><dt>Profile protection</dt><dd>Encrypted locally</dd></div><div class=\"data-row\"><dt>Device binding</dt><dd>This device</dd></div></dl><div class=\"spacer\"></div><div class=\"note \"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div>Only the verified profile is admitted. Importing does not start the VPN.</div></div><div class=\"footer-actions\"><button class=\"btn\" data-action=\"confirm-import\" >Confirm encrypted storage</button><button class=\"btn outline\" data-go=\"import-methods\" >Cancel</button></div>","back":"import-preview","active":"profiles","grandma":false,"connected":null,"sources":["android/core/ui/src/main/res/values/strings.xml"],"sheet":""},{"id":"import-success","name":"Profiles · Import complete","group":"Trust","html":"<h1 class=\"page-title\">Profile imported</h1><span class=\"state-tag \"><span class=\"dot\"></span>Home · verified</span><div class=\"empty\" style=\"padding-bottom:35px\"><h2>Ready on<br>this device.</h2><p>The encrypted profile is stored locally.<br>No connection has been started.</p></div><dl class=\"data-list\"><div class=\"data-row\"><dt>Generation</dt><dd class=\"mono\">12</dd></div><div class=\"data-row\"><dt>Deployment</dt><dd>Verified local authority</dd></div><div class=\"data-row\"><dt>Connection</dt><dd>Disconnected</dd></div></dl><div class=\"footer-actions\"><button class=\"btn\" data-go=\"home-disconnected\" >Open home</button><button class=\"btn outline\" data-go=\"profile-details\" >Profile details</button></div>","back":"","active":"profiles","grandma":false,"connected":false,"sources":["android/core/ui/src/main/res/values/strings.xml"],"sheet":""},{"id":"import-rejected","name":"Profiles · Import rejected","group":"Recovery","html":"<h1 class=\"page-title\">Import rejected</h1><span class=\"state-tag err\"><span class=\"dot\"></span>Verification failed</span><div style=\"height:30px\"></div><p class=\"body-copy\">This profile cannot be admitted. Its signature did not pass verification.</p><dl class=\"data-list\"><div class=\"data-row\"><dt>Reason</dt><dd>Invalid signature</dd></div><div class=\"data-row\"><dt>Existing profile</dt><dd>Unchanged</dd></div><div class=\"data-row\"><dt>New connection</dt><dd>Not started</dd></div></dl><div class=\"spacer\"></div><div class=\"note warn\"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div><strong>Keep the existing trusted state</strong>Ask the owner for a fresh profile. Do not bypass signature or fingerprint checks.</div></div><div class=\"footer-actions\"><button class=\"btn\" data-go=\"import-methods\" >Import profile file</button><button class=\"btn outline\" data-go=\"profiles\" >Back to profiles</button></div>","back":"profiles","active":"profiles","grandma":false,"connected":false,"sources":["android/core/ui/src/main/res/values/strings.xml"],"sheet":""},{"id":"missing-key","name":"Profiles · Missing device key","group":"Recovery","html":"<h1 class=\"page-title\">Device key<br>not found</h1><span class=\"state-tag warn\"><span class=\"dot\"></span>Import blocked</span><div style=\"height:26px\"></div><p class=\"body-copy\">The sealed profile requires a device key that is not available here.</p><div class=\"step-list\"><div class=\"step\"><span class=\"step-num\">01</span><div><strong>Use the intended device</strong><span class=\"muted\">A profile sealed for another device cannot be opened here.</span></div></div><div class=\"step\"><span class=\"step-num\">02</span><div><strong>Recover or enroll again</strong><span class=\"muted\">Restore the right encrypted backup, or send the owner a new request.</ tn outline\" data-go=\"import-methods\" ><svg class=\"\" data-icon=\"plus\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg> Add a verified profile</button></div>","back":"","active":"profiles","grandma":false,"connected":null,"sources":["android/core/ui/src/main/res/values/strings.xml"],"sheet":""},{"id":"profile-details","name":"Profiles · Read-only details","group":"Profiles","html":"<h1 class=\"page-title\">Home</h1><p class=\"page-subtitle\">Kurd profile · stored on this device</p><span class=\"state-tag \"><span class=\"dot\"></span>Verified local authority</span><div style=\"height:24px\"></div><dl class=\"data-list\"><div class=\"data-row\"><dt>Generation</dt><dd class=\"mono\">12</dd></div><div class=\"data-row\"><dt>Valid until</dt><dd>21 Sep 2026 · 12:00</dd></div><div class=\"data-row\"><dt>Protocol</dt><dd>Kurd</dd></div><div class=\"data-row\"><dt>Device binding</dt><dd>This device</dd></div><div class=\"data-row\"><dt>Relay compatibility</dt><dd>From verified runtime plan</dd></div><div class=\"data-row\"><dt>Signed updates</dt><dd>No update source</dd></div></dl><button class=\"row \" data-go=\"deployment\"><span class=\"row-text\"><span class=\"label\">Deployment trust</span><div class=\"description\">Authority and signed publication</div></span><svg class=\"chev\" data-icon=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg></button><button class=\"row \" data-go=\"session-plan\"><span class=\"row-text\"><span class=\"label\">Session plan</span><div class=\"description\">Selected strategy and permitted fallback</div></span><svg class=\"chev\" data-icon=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg></button><div class=\"spacer\"></div><div class=\"footer-actions\"><button class=\"btn outline\" data-action=\"use-profile\" >Use profile</button></div><p class=\"repo-note\">Alias and expiry are illustrative. Secrets are not shown.</p>","back":"profiles","active":"profiles","grandma":false,"connected":null,"sources":["android/co tings · Connection and Android authority","group":"Settings","html":"<h1 class=\"page-title\">Connection</h1><p class=\"page-subtitle\">Preferences cannot expand a signed profile.</p><dl class=\"data-list\"><div class=\"data-row\"><dt>Selection mode</dt><dd>Automatic</dd></div><div class=\"data-row\"><dt>Safe reconnect</dt><dd>Within signed retry limit</dd></div><div class=\"data-row\"><dt>Android always-on</dt><dd>Off</dd></div><div class=\"data-row\"><dt>Android lockdown</dt><dd>Off</dd></div></dl><button class=\"inline-link\" data-action=\"android-settings\" >Review Android VPN settings</button><div class=\"eyebrow section-label\">Not available in this configuration</div><dl class=\"data-list dense\"><div class=\"data-row\"><dt>Manual strategy</dt><dd>No allowed set exposed</dd></div><div class=\"data-row\"><dt>Auto-connect on app launch</dt><dd>Unavailable</dd></div><div class=\"data-row\"><dt>Auto-connect after device boot</dt><dd>Unavailable</dd></div><div class=\"data-row\"><dt>Allow local network</dt><dd>Unavailable</dd></div></dl><div class=\"spacer\"></div><div class=\"note \"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div>Android blocking is reported separately. This app cannot enable lockdown itself.</div></div><p class=\"repo-note\">Available controls must follow runtime capabilities, not just saved preferences.</p>","back":"settings","active":"settings","grandma":false,"connected":null,"sources":["android/core/ui/src/main/res/values/strings.xml"],"sheet":""},{"id":"tunnel-dns","name":"Settings · Tunnel and DNS","group":"Settings","html":"<h1 class=\"page-title\">Tunnel and DNS</h1><p class=\"page-subtitle\">Current profile and runtime limits.</p><dl class=\"data-list\"><div class=\"data-row\"><dt>IP family</dt><dd>IPv4</dd></div><div class=\"data-row\"><dt>DNS</dt><dd>Internal TUN DNS</dd></div><div class=\"data-row\"><dt>MTU</dt><dd class=\"mono\">1400</dd></div><div class=\"data-row\"><dt>Treat VPN as metered</dt><dd>Off</dd></div></dl><div class=\"eyebrow section-label\">Unavailable without verified support</div><dl class=\"data-list dense\"><div class=\"data-row\"><dt>Custom DNS resolver</dt><dd>Unavailable</dd></div><div class=\"data-row\"><dt>Public DNS presets</dt><dd>Unavailable</dd></div><div class=\"data-row\"><dt>IPv6-only mode</dt><dd>Unavailable in this test</dd></div></dl><div class=\"spacer\"></div><div class=\"note \"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div>Do not offer an external DNS preset until an authenticated path can keep its queries inside the tunnel.</div></div><p class=\"repo-note\">Owned-loopback configuration shown; live capabilities are build-dependent.</p>","back":"settings","active":"settings","grandma":false,"connected":null,"sources":["android/core/ui/src/main/res/values/strings.xml"],"sheet":""},{"id":"routing","name":"Settings · Per-app routing","group":"Settings","html":"<h1 class=\"page-title\">Routing</h1><p class=\"page-subtitle\">Rules can narrow the routes your session allows.</p><div class=\"eyebrow section-label\">Per-app routing</div><div class=\"row \"><span class=\"row-text\"><span class=\"label\">All apps</span><div class=\"description\">All apps are eligible for authorized routes.</div></span><span class=\"value\">Selected</span></div><div class=\"row \"><span class=\"row-text\"><span class=\"label\">Include selected apps</span></span><span class=\"value\">Not selected</span></div><div class=\"row \"><span class=\"row-text\"><span class=\"label\">Exclude selected apps</span></span><span class=\"value\">Not selected</span></div><div style=\"height:24px\"></div><div class=\"note warn\"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div><strong>Before excluding apps</strong>Excluded apps may bypass the VPN. Android always-on lockdown is the authority for blocking non-VPN traffic.</div></div><div class=\"spacer\"></div><p class=\"body-copy\">Only launchable applications are listed. Kurdistan VPN does not request broad package visibility.</p><p class=\"repo-note\">No per-app rules are selected in this example.</p>","back":"settings","active":"settings","grandma":false,"connected":null,"sources":["android/core/ui/src/main/res/values/strings.xml"],"sheet":""},{"id":"updates-probes","name":"Settings · Signed updates and probes","group":"Settings","html":"<h1 class=\"page-title\">Updates and probes</h1><dl class=\"data-list\"><div class=\"data-row\"><dt>Automatic signed profile updates</dt><dd>Unavailable</dd></div><div class=\"data-row\"><dt>Update source</dt><dd>Not configured</dd></div><div class=\"data-row\"><dt>Last update</dt><dd>No update imported</dd></div></dl><div style=\"height:20px\"></div><div class=\"note \"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div>Imported signed update bundles remain available through the profile import flow.</div></div><div class=\"eyebrow section-label\">Health probes</div><dl class=\"data-list\"><div class=\"data-row\"><dt>Method</dt><dd>Kurd session</dd></div><div class=\"data-row\"><dt>Latest result</dt><dd>No probe run yet</dd></div><div class=\"data-row\"><dt>TCP / HTTP / ICMP</dt><dd>Not authorized</dd></div></dl><div class=\"spacer\"></div><div class=\"footer-actions\"><button class=\"btn outline\" data-action=\"demo-probe\" >Run Kurd loopback probe</button><button class=\"btn link\" data-go=\"rotation-preview\" >Import signed update</button></div>","back":"settings","active":"settings","grandma":false,"connected":null,"sources":["android/core/ui/src/main/res/values/strings.xml"],"sheet":""},{"id":"privacy","name":"Privacy · Local storage and recovery","group":"Settings","html":"<h1 class=\"page-title\">Privacy and recovery</h1><dl class=\"data-list\"><div class=\"data-row\"><dt>Telemetry</dt><dd>Off</dd></div><div class=\"data-row\"><dt>Remote crash reporting</dt><dd>Off</dd></div><div class=\"data-row\"><dt>Profiles</dt><dd>Encrypted locally</dd></div><div class=\"data-row\"><dt>Cloud backup</dt><dd>Disabled</dd></div></dl><button class=\"row \" data-go=\"backup\"><svg class=\"lead-icon\" data-icon=\"file\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><span class=\"row-text\"><span class=\"label\">Create encrypted backup</span><div class=\"description\">Export only after authorization</div></span><svg class=\"chev\" data-icon=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg></button><button class=\"row \" data-go=\"recovery\"><svg class=\"lead-icon\" data-icon=\"lock\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><span class=\"row-text\"><span class=\"label\">Open recovery settings</span><div class=\"description\">Preserve protected state until reviewed</div></span><svg class=\"chev\" data-icon=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg></button><button class=\"row \" data-go=\"enrollment\"><svg class=\"lead-icon\" data-icon=\"key\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><span class=\"row-text\"><span class=\"label\">Device enrollment</span><div class=\"description\">Manage device-owned public requests</div></span><svg class=\"chev\" data-icon=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg></button><div class=\"spacer\"></div><div class=\"note \"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div>Private keys and profile contents do not appear in this interface.</div></div><p class=\"repo-note\">These labels describe the repository’s local-first design; this prototype stores no keys.</p>","back":"settings","active":"settings","grandma":false,"connected":null,"sources":["android/core/ui/src/main/res/values/strings.xml"],"sheet":""},{"id":"diagnostics","name":"Diagnostics · Local categorical events","group":"Diagnostics","html":"<h1 class=\"page-title\">Diagnostics</h1><p class=\"page-subtitle\">Local diagnostic events</p><span class=\"state-tag off\"><span class=\"dot\"></span>Categorical · redacted · on-device</span><div style=\"height:24px\"></div><dl class=\"data-list\"><div class=\"data-row\"><dt>09:41 · Runtime</dt><dd>Session stopped</dd></div><div class=\"data-row\"><dt>09:40 · Authority</dt><dd>Profile accepted</dd></div><div class=\"data-row\"><dt>09:40 · Storage</dt><dd>Protected read complete</dd></div></dl><div style=\"height:25px\"></div><div class=\"note \"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div><strong>Export boundary</strong>No payloads, profile identifiers, destinations, or device identifiers.</div></div><div class=\"spacer\"></div><button class=\"row \" data-go=\"expert-controls\"><span class=\"row-text\"><span class=\"label\">Expert controls</span><div class=\"description\">Retention and resource boundaries</div></span><svg class=\"chev\" data-icon=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg></button><button class=\"row \" data-go=\"about\"><span class=\"row-text\"><span class=\"label\">About this build</span><div class=\"description\">Versions, release limits, and source</div></span><svg class=\"chev\" data-icon=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg></button><div class=\"footer-actions\"><button class=\"btn outline\" data-go=\"diagnostics-export\" >Prepare redacted diagnostics</button></div><p class=\"repo-note\">Illustrative categories; not retained real traffic or logs.</p>","back":"settings","active":"settings","grandma":false,"connected":null,"sources":["android/core/ui/src/main/res/values/strings.xml"],"sheet":""},{"id":"diagnostics-export","name":"Diagnostics · Export preview","group":"Diagnostics","html":"<h1 class=\"page-title\">Review diagnostics</h1><p class=\"page-subtitle\">Nothing is exported until you confirm.</p><dl class=\"data-list\"><div class=\"data-row\"><dt>Included</dt><dd>Categorical events</dd></div><div class=\"data-row\"><dt>Payloads</dt><dd>Excluded</dd></div><div class=\"data-row\"><dt>Profile identifiers</dt><dd>Excluded</dd></div><div class=\"data-row\"><dt>Destinations and DNS names</dt><dd>Excluded</dd></div><div class=\"data-row\"><dt>Device identifiers</dt><dd>Excluded</dd></div><div class=\"data-row\"><dt>Export destination</dt><dd>Chosen by you</dd></div></dl><div class=\"spacer\"></div><div class=\"note \"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div>Review locally, then explicitly confirm. No automatic upload or remote crash report is created.</div></div><div class=\"footer-actions\"><button class=\"btn\" data-action=\"demo-diagnostics\" >Confirm and export</button><button class=\"btn outline\" data-go=\"diagnostics\" >Cancel</button></div>","back":"diagnostics","active":"settings","grandma":false,"connected":null,"sources":["android/core/ui/src/main/res/values/strings.xml"],"sheet":""},{"id":"backup","name":"Recovery · Encrypted backup","group":"Recovery","html":"<h1 class=\"page-title\">Encrypted backup</h1><p class=\"page-subtitle\">Protect a local recovery copy.</p><p class=\"body-copy\">Choose a passphrase before exporting encrypted profile data. Device authorization is required for the real export.</p><label class=\"field\">Backup passphrase<input type=\"password\" placeholder=\"Enter a passphrase\" autocomplete=\"off\" aria-label=\"Backup passphrase\"></label><p class=\"small\">At least 12 code points. Never uploaded or stored.</p><div class=\"spacer\"></div><div class=\"note \"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div>This is an Android data backup. It does not replace the owner’s separate VPS authority backup.</div></div><div class=\"footer-actions\"><button class=\"btn outline\" data-action=\"demo-backup\" >Create encrypted backup</button><button class=\"btn link\" data-action=\"demo-restore\" >Open backup for restore</button></div><p class=\"repo-note\">Prototype only: no backup file or encryption operation is created.</p>","back":"privacy","active":"settings","grandma":false,"connected":null,"sources":["android/core/ui/src/main/res/values/strings.xml"],"sheet":""},{"id":"recovery","name":"Recovery · Protected state needs attention","group":"Recovery","html":"<h1 class=\"page-title\">Protected state<br>needs attention</h1><span class=\"state-tag warn\"><span class=\"dot\"></span>Connection remains blocked</span><div style=\"height:28px\"></div><p class=\"body-copy\">Protected profiles or credentials are quarantined because their consistency cannot be proven. Existing records remain preserved.</p><dl class=\"data-list\"><div class=\"data-row\"><dt>Profile activation</dt><dd>Blocked</dd></div><div class=\"data-row\"><dt>Automatic repair</dt><dd>Not performed</dd></div><div class=\"data-row\"><dt>Deletion or reset</dt><dd>Explicit confirmation required</dd></div></dl><div class=\"spacer\"></div><div class=\"note warn\"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div><strong>Preserve what can be recovered</strong>Review privacy-safe diagnostics before a separate recovery or reset decision. Do not silently recreate keys.</div></div><div class=\"footer-actions\"><button class=\"btn\" data-go=\"diagnostics\" >Open privacy-safe diagnostics</button><button class=\"btn outline\" data-action=\"demo-recovery\" >Review recovery options</button></div>","back":"privacy","active":"settings","grandma":false,"connected":false,"sources":["android/app/src/main/res/values/strings.xml"],"sheet":""},{"id":"about","name":"About · Release and source boundaries","group":"Settings","html":"<h1 class=\"page-title\">Kurdistan VPN</h1><p class=\"page-subtitle\">Profile-driven connectivity with explicit trust and recovery</p><dl class=\"data-list\"><div class=\"data-row\"><dt>Release status</dt><dd>Pre-release</dd></div><div class=\"data-row\"><dt>Source reference</dt><dd class=\"mono\">7d583d186c7e</dd></div><div class=\"data-row\"><dt>App / core version</dt><dd>Supplied by the installed build</dd></div><div class=\"data-row\"><dt>Public release egress</dt><dd>Not yet validated</dd></div></dl><div style=\"height:24px\"></div><p class=\"body-copy\">The repository contains compiler, local authority, Android, and controlled transport paths. Source presence is not evidence of production readiness or censorship bypass.</p><div class=\"note \"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div><strong>Current boundary</strong>Public non-loopback relay and unrestricted Internet egress are not part of a released production build.</div></div><div class=\"spacer\"></div><p class=\"repo-note\">Repository-anchored design study · 14 September 2026<br>All connection data in this bundle is illustrative.</p>","back":"diagnostics","active":"settings","grandma":false,"connected":null,"sources":["README.md","docs/self-hosting/QUICKSTART.md"],"sheet":""},{"id":"interface-off","name":"Interface · Grandma Mode off","group":"Interface","html":"<h1 class=\"page-title\">Interface</h1><div class=\"interface-primary\"><div class=\"row-text\"><div class=\"label\">Grandma Mode</div><div class=\"description\">Larger text. Fewer controls.</div></div><button class=\"switch-hit\" role=\"switch\" aria-checked=\"false\" aria-label=\"Grandma Mode\" data-action=\"grandma-toggle\"><span class=\"switch\"></span></button></div><div style=\"height:17px\"></div><p class=\"body-copy\">Simplify the interface without changing the profile, trust, or connection policy.</p><div style=\"height:22px\"></div><button class=\"row \" data-go=\"appearance\"><span class=\"row-text\"><span class=\"label\">Appearance</span></span><span class=\"value\"><span data-theme-label>Light</span></span><svg class=\"chev\" data-icon=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg></button><button class=\"row \" data-go=\"text-motion\"><span class=\"row-text\"><span class=\"label\">Text and motion</span></span><span class=\"value\">Default</span><svg class=\"chev\" data-icon=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg></button><div class=\"interface-primary\"><div class=\"row-text\"><div class=\"label\">High contrast</div><div class=\"description\">Increase text and separator contrast.</div></div><button class=\"switch-hit\" role=\"switch\" aria-checked=\"false\" aria-label=\"High contrast\" data-action=\"contrast-toggle\"><span class=\"switch\"></span></button></div><div class=\"spacer\"></div><div class=\"footer-actions\"><button class=\"btn outline\" data-go=\"home\" >Open home</button></div>","back":"settings","active":"settings","grandma":false,"connected":null,"sources":["User brief: preserve Grandma Mode","android/core/ui/src/main/res/values/strings.xml"],"sheet":""},{"id":"interface-on","name":"Interface · Grandma Mode on","group":"Interface","html":"<h1 class=\"page-title\">Interface</h1><div class=\"interface-primary\"><div class=\"row-text\"><div class=\"label\">Grandma Mode</div><div class=\"description\">Larger text. Fewer controls.</div></div><button class=\"switch-hit\" role=\"switch\" aria-checked=\"true\" aria-label=\"Grandma Mode\" data-action=\"grandma-toggle\"><span class=\"switch\"></span></button></div><div class=\"mode-info enter\"><div class=\"note tint\"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div><strong>Grandma Mode is on</strong>Connection settings stay the same.</div></div></div><div style=\"height:22px\"></div><button class=\"row \" data-go=\"appearance\"><span class=\"row-text\"><span class=\"label\">Appearance</span></span><span class=\"value\"><span data-theme-label>Light</span></span><svg class=\"chev\" data-icon=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg></button><button class=\"row \" data-go=\"text-motion\"><span class=\"row-text\"><span class=\"label\">Text and motion</span></span><span class=\"value\">Large</span><svg class=\"chev\" data-icon=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg></button><div class=\"interface-primary\"><div class=\"row-text\"><div class=\"label\">High contrast</div><div class=\"description\">Increase text and separator contrast.</div></div><button class=\"switch-hit\" role=\"switch\" aria-checked=\"false\" aria-label=\"High contrast\" data-action=\"contrast-toggle\"><span class=\"switch\"></span></button></div><div class=\"spacer\"></div><div class=\"footer-actions\"><button class=\"btn\" data-action=\"open-grandma\" >Open Grandma Mode home</button></div>","back":"settings","active":"settings","grandma":false,"connected":null,"sources":["User brief: preserve Grandma Mode","android/core/ui/src/main/res/values/strings.xml"],"sheet":""},{"id":"appearance","name":"Interface · Light and dark appearance","group":"Interface","html":"<h1 class=\"page-title\">Appearance</h1><p class=\"page-subtitle\">The same hierarchy in both themes.</p><div class=\"appearance-tiles\"><button class=\"appearance-tile\" data-action=\"theme-light\" data-theme-tile=\"light\"><div class=\"mini-ui \"><div class=\"mini-brand\">KURDISTAN</div><div class=\"mini-head\">Connected</div><div class=\"mini-sub\">Home · Kurd profile</div><div class=\"mini-line\"></div><div class=\"mini-button\"></div></div><div class=\"tile-caption\">Light<span class=\"radio\" data-theme-radio=\"light\"></span></div></button><button class=\"appearance-tile\" data-action=\"theme-dark\" data-theme-tile=\"dark\"><div class=\"mini-ui dark-mini\"><div class=\"mini-brand\">KURDISTAN</div><div class=\"mini-head\">Connected</div><div class=\"mini-sub\">Home · Kurd profile</div><div class=\"mini-line\"></div><div class=\"mini-button\"></div></div><div class=\"tile-caption\">Dark<span class=\"radio\" data-theme-radio=\"dark\"></span></div></button></div><button class=\"row\" data-action=\"theme-system\" ><span class=\"row-text\"><span class=\"label\">Follow device appearance</span><div class=\"description\">Use the current system preference.</div></span><svg class=\"chev\" data-icon=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg></button><div class=\"spacer\"></div><div class=\"note \"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div>Colour indicates state, never trust by itself. Every state also has a text label.</div></div>","back":"interface","active":"settings","grandma":false,"connected":null,"sources":["android/core/ui/src/main/res/values/strings.xml"],"sheet":""},{"id":"text-motion","name":"Interface · Text and motion","group":"Interface","html":"<h1 class=\"page-title\">Text and motion</h1><div class=\"eyebrow section-label\">Text size</div><div class=\"segmented\"><button class=\"btn\" data-action=\"text-default\" data-size=\"default\">Default</button><button class=\"btn\" data-action=\"text-large\" data-size=\"large\">Large</button></div><div class=\"text-preview\" id=\"type-preview\"><h2>Home</h2><p>Active Kurd profile · generation 12</p></div><div class=\"interface-primary\"><div class=\"row-text\"><div class=\"label\">Reduced motion</div><div class=\"description\">Remove spatial transitions and looping movement.</div></div><button class=\"switch-hit\" role=\"switch\" aria-checked=\"false\" aria-label=\"Reduced motion\" data-action=\"motion-toggle\"><span class=\"switch\"></span></button></div><div class=\"spacer\"></div><p class=\"body-copy\">Screen changes use a short fade and a six-pixel movement. Switches move without bounce. No decorative glow or pulsing status.</p><p class=\"repo-note\">Grandma Mode keeps its own larger hierarchy. Device motion preferences are respected.</p>","back":"interface","active":"settings","grandma":false,"connected":null,"sources":["User brief: polished motion","android/core/ui/src/main/res/values/strings.xml"],"sheet":""},{"id":"grandma-on","name":"Grandma · Verified-relay preview","group":"Grandma Mode","html":"<div class=\"gm-hero\"><div class=\"gm-state positive\"><span class=\"dot\"></span>Connected</div><h1 class=\"gm-title \">VPN is on.</h1><p class=\"gm-subtitle\">Connected through<br>Home.</p><p class=\"gm-helper\">You can leave this screen.</p></div><div class=\"gm-preview\">Live-relay design preview · not a released VPN connection.</div><div class=\"gm-bottom\"><button class=\"btn outline\" data-go=\"grandma-disconnect\" >Turn VPN off</button></div>","back":"","active":"home","grandma":true,"connected":true,"sources":["User brief: Grandma Mode","android/feature/home/src/main/kotlin/org/kurdistanvpn/feature/home/HomeScreen.kt"],"sheet":""},{"id":"grandma-off","name":"Grandma · Disconnected","group":"Grandma Mode","html":"<div class=\"gm-hero\"><div class=\"gm-state muted\"><span class=\"dot\"></span>Disconnected</div><h1 class=\"gm-title \">VPN is off.</h1><p class=\"gm-subtitle\">Your VPN is not connected.</p><p class=\"gm-helper\">Turn it on when you are ready.</p></div><div class=\"gm-bottom\"><button class=\"btn\" data-action=\"grandma-connect\" >Turn VPN on</button></div>","back":"","active":"home","grandma":true,"connected":false,"sources":["User brief: Grandma Mode","android/feature/home/src/main/kotlin/org/kurdistanvpn/feature/home/HomeScreen.kt"],"sheet":""},{"id":"grandma-reconnecting","name":"Grandma · Reconnecting","group":"Grandma Mode","html":"<div class=\"gm-hero\"><div class=\"gm-state warning\"><span class=\"dot\"></span>VPN is not connected</div><h1 class=\"gm-title long\">Trying again.</h1><p class=\"gm-subtitle\">The VPN connection<br>was interrupted.</p><p class=\"gm-helper\">Only permitted retries will be tried. This is not a connected state.</p></div><div class=\"progress-line warn\"><span></span></div><div class=\"gm-bottom\"><button class=\"btn outline\" data-action=\"cancel-connect\" >Stop trying</button></div>","back":"","active":"home","grandma":true,"connected":false,"sources":["User brief: Grandma Mode","android/feature/home/src/main/kotlin/org/kurdistanvpn/feature/home/HomeScreen.kt"],"sheet":""},{"id":"grandma-attention","name":"Grandma · Revoked profile","group":"Grandma Mode","html":"<div class=\"gm-hero\"><div class=\"gm-state warning\"><span class=\"dot\"></span>Profile cannot be used</div><h1 class=\"gm-title long\">Setup needs<br>attention.</h1><p class=\"gm-subtitle\">Your connection profile<br>has been revoked.</p><p class=\"gm-helper\">Ask the person who set this up for a replacement profile.</p></div><div class=\"gm-bottom\"><button class=\"btn\" data-go=\"grandma-settings\" >Open settings</button></div>","back":"","active":"home","grandma":true,"connected":false,"sources":["User brief: Grandma Mode","android/feature/home/src/main/kotlin/org/kurdistanvpn/feature/home/HomeScreen.kt"],"sheet":""},{"id":"grandma-settings","name":"Grandma · Simplified settings","group":"Grandma Mode","html":"<h1 class=\"page-title\">Settings</h1><div class=\"interface-primary\"><div class=\"row-text\"><div class=\"label\">Grandma Mode</div><div class=\"description\">Larger text. Fewer controls.</div></div><button class=\"switch-hit\" role=\"switch\" aria-checked=\"true\" aria-label=\"Grandma Mode\" data-action=\"grandma-exit\"><span class=\"switch\"></span></button></div><div class=\"row \"><span class=\"row-text\"><span class=\"label\">Your profile</span><div class=\"description\">Set up by your deployment owner.</div></span><span class=\"value\">Home</span></div><button class=\"row \" data-go=\"appearance\"><span class=\"row-text\"><span class=\"label\">Appearance</span><div class=\"description\">Light or dark.</div></span><svg class=\"chev\" data-icon=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg></button><button class=\"row \" data-go=\"text-motion\"><span class=\"row-text\"><span class=\"label\">Text and motion</span><div class=\"description\">Larger text and reduced movement.</div></span><svg class=\"chev\" data-icon=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg></button><div class=\"spacer\"></div><div class=\"note \"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div>Trust and connection rules stay the same. This mode only changes what you see.</div></div><div class=\"footer-actions\"><button class=\"btn outline\" data-action=\"open-grandma\" >Back to home</button></div>","back":"grandma-home","active":"home","grandma":true,"connected":null,"sources":["User brief: Grandma Mode"],"sheet":""},{"id":"grandma-disconnect","name":"Grandma · Stop confirmation","group":"Grandma Mode","html":"<div class=\"gm-hero\"><div class=\"gm-state positive\"><span class=\"dot\"></span>Connected</div><h1 class=\"gm-title \">VPN is on.</h1><p class=\"gm-subtitle\">Connected through<br>Home.</p><p class=\"gm-helper\">You can leave this screen.</p></div><div class=\"gm-preview\">Live-relay design preview · not a released VPN connection.</div><div class=\"gm-bottom\"><button class=\"btn outline\" data-go=\"grandma-disconnect\" >Turn VPN off</button></div>","back":"","active":"home","grandma":true,"connected":true,"sources":["User brief: Grandma Mode","android/core/ui/src/main/res/values/strings.xml"],"sheet":"<div class=\"scrim\"></div><section class=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sheet-heading\"><div class=\"sheet-handle\"></div><h2 id=\"sheet-heading\">Turn VPN off?</h2><p>The VPN session will stop. Android may still block non-VPN connections, depending on its settings.</p><button class=\"btn\" data-go=\"grandma-on\" >Keep VPN on</button><button class=\"btn outline\" data-action=\"disconnect\" >Turn VPN off</button></section>"},{"id":"grandma-exit","name":"Grandma · Return to full interface","group":"Grandma Mode","html":"<h1 class=\"page-title\">Settings</h1><div class=\"interface-primary\"><div class=\"row-text\"><div class=\"label\">Grandma Mode</div><div class=\"description\">Larger text. Fewer controls.</div></div><button class=\"switch-hit\" role=\"switch\" aria-checked=\"true\" aria-label=\"Grandma Mode\" data-action=\"grandma-exit\"><span class=\"switch\"></span></button></div><div class=\"row \"><span class=\"row-text\"><span class=\"label\">Your profile</span><div class=\"description\">Set up by your deployment owner.</div></span><span class=\"value\">Home</span></div><button class=\"row \" data-go=\"appearance\"><span class=\"row-text\"><span class=\"label\">Appearance</span><div class=\"description\">Light or dark.</div></span><svg class=\"chev\" data-icon=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg></button><div class=\"spacer\"></div>","back":"","active":"home","grandma":true,"connected":null,"sources":["User brief: Grandma Mode"],"sheet":"<div class=\"scrim\"></div><section class=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sheet-heading\"><div class=\"sheet-handle\"></div><h2 id=\"sheet-heading\">Leave Grandma Mode?</h2><p>The full interface will return. Your profile, trust, and connection will not change.</p><button class=\"btn\" data-go=\"grandma-settings\" >Stay in Grandma Mode</button><button class=\"btn outline\" data-action=\"exit-grandma\" >Use full interface</button></section>"},{"id":"grandma-loopback","name":"Grandma · Honest local-test state","group":"Grandma Mode","html":"<div class=\"gm-hero\"><div class=\"gm-state positive\"><span class=\"dot\"></span>Local test only</div><h1 class=\"gm-title \">Test is on.</h1><p class=\"gm-subtitle\">A test is running<br>on this device.</p><p class=\"gm-helper\">This test does not provide Internet access.</p></div><div class=\"gm-bottom\"><button class=\"btn outline\" data-action=\"disconnect\" >Stop test</button></div>","back":"","active":"home","grandma":true,"connected":true,"sources":["android/core/ui/src/main/res/values/strings.xml","User brief: Grandma Mode"],"sheet":""},{"id":"expert-controls","name":"Expert · Capability boundaries","group":"Settings","html":"<h1 class=\"page-title\">Expert controls</h1><p class=\"page-subtitle\">Availability is separate from preferences.</p><dl class=\"data-list\"><div class=\"data-row\"><dt>Local logs</dt><dd>Categorical and redacted</dd></div><div class=\"data-row\"><dt>Debug logging</dt><dd>Off</dd></div><div class=\"data-row\"><dt>Runtime resource tuning</dt><dd>Unavailable</dd></div><div class=\"data-row\"><dt>Compiled safety limits</dt><dd>Enforced by the core</dd></div></dl><div class=\"eyebrow section-label\">Deliberately absent</div><p class=\"body-copy\">No allow-insecure TLS, unsafe fingerprints, traffic sniffing, unauthenticated hotspot proxy, or direct egress controls.</p><div class=\"spacer\"></div><div class=\"note \"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div><strong>No cosmetic security switches</strong>Manual tuning must not appear active until the runtime actually consumes and validates it.</div></div><p class=\"repo-note\">Read-only capability presentation; no unsupported tuning is offered.</p>","back":"diagnostics","active":"settings","grandma":false,"connected":null,"sources":["android/core/ui/src/main/res/values/strings.xml"],"sheet":""},{"id":"vpn-permission-revoked","name":"Connection · Android permission revoked","group":"Recovery","html":"<h1 class=\"page-title\">VPN permission<br>revoked</h1><span class=\"state-tag warn\"><span class=\"dot\"></span>VPN session stopped</span><div style=\"height:27px\"></div><p class=\"body-copy\">Android VPN permission is no longer available. This is different from the deployment owner revoking a profile.</p><dl class=\"data-list\"><div class=\"data-row\"><dt>Profile trust</dt><dd>Unchanged</dd></div><div class=\"data-row\"><dt>VPN permission</dt><dd>Required</dd></div><div class=\"data-row\"><dt>Connection</dt><dd>Not active</dd></div></dl><div class=\"spacer\"></div><div class=\"note \"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div>Request permission again only after an explicit action. Do not reconnect silently.</div></div><div class=\"footer-actions\"><button class=\"btn\" data-go=\"vpn-consent\" >Review VPN permission</button><button class=\"btn outline\" data-go=\"home-disconnected\" >Back to home</button></div>","back":"home","active":"home","grandma":false,"connected":false,"sources":["android/core/ui/src/main/res/values/strings.xml"],"sheet":""},{"id":"home-degraded","name":"Home · Degraded","group":"Connection","html":"<h1 class=\"page-title\">Degraded</h1><span class=\"state-tag warn\"><span class=\"dot\"></span>Do not treat this as connected</span><div style=\"height:26px\"></div><button class=\"home-node\" data-go=\"profiles\" ><div><div class=\"eyebrow\" style=\"margin-bottom:8px\">Active Kurd profile</div><div class=\"node-label\">Home</div><div class=\"node-subtitle\">Generation 12 · verified local authority</div></div><svg class=\"\" data-icon=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg></button><dl class=\"data-list\"><div class=\"data-row\"><dt>Session health</dt><dd>Degraded</dd></div><div class=\"data-row\"><dt>Current forwarding</dt><dd>Not asserted</dd></div><div class=\"data-row\"><dt>Next action</dt><dd>Review diagnostics</dd></div></dl><div class=\"spacer\"></div><div class=\"note warn\"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div><strong>Runtime needs attention</strong>Show the runtime state explicitly. A previous successful session must not leave a green connected indicator visible.</div></div><div class=\"footer-actions\"><button class=\"btn\" data-go=\"diagnostics\" >Open privacy-safe diagnostics</button></div>","back":"","active":"home","grandma":false,"connected":false,"sources":["android/feature/home/src/main/kotlin/org/kurdistanvpn/feature/home/HomeScreen.kt"],"sheet":""},{"id":"home-recovering","name":"Home · Recovering","group":"Connection","html":"<div class=\"hero compact\"><div class=\"eyebrow\">VPN state</div><div class=\"hero-state\"><h1>Recovering</h1></div><div class=\"status-copy warning\"><span class=\"dot\"></span>Rechecking runtime and profile state</div></div><button class=\"home-node\" data-go=\"profiles\" ><div><div class=\"eyebrow\" style=\"margin-bottom:8px\">Active Kurd profile</div><div class=\"node-label\">Home</div><div class=\"node-subtitle\">Generation 12 · verified local authority</div></div><svg class=\"\" data-icon=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg></button><div class=\"progress-line \"><span></span></div><div style=\"height:25px\"></div><dl class=\"data-list\"><div class=\"data-row\"><dt>Authority</dt><dd>Rechecked before activation</dd></div><div class=\"data-row\"><dt>Session</dt><dd>Fresh authenticated session</dd></div><div class=\"data-row\"><dt>Fallback</dt><dd>Signed strategies only</dd></div></dl><div style=\"height:22px\"></div><div class=\"note \"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div>Recovery is not a connected state. Profile authority and the runtime must be verified before a new session can activate.</div></div><div class=\"footer-actions\"><button class=\"btn outline\" data-action=\"cancel-connect\" >Cancel</button></div>","back":"","active":"home","grandma":false,"connected":false,"sources":["android/feature/home/src/main/kotlin/org/kurdistanvpn/feature/home/HomeScreen.kt","README.md"],"sheet":""},{"id":"home-stopping","name":"Home · Disconnecting","group":"Connection","html":"<h1 class=\"page-title\">Disconnecting…</h1><span class=\"state-tag off\"><span class=\"dot\"></span>Stopping the current session</span><div style=\"height:30px\"></div><button class=\"home-node\" data-go=\"profiles\" ><div><div class=\"eyebrow\" style=\"margin-bottom:8px\">Active Kurd profile</div><div class=\"node-label\">Home</div><div class=\"node-subtitle\">Generation 12 · verified local authority</div></div><svg class=\"\" data-icon=\"chevron\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg></button><div class=\"progress-line\"><span></span></div><div style=\"height:28px\"></div><p class=\"body-copy\">Closing the session and completing VPN teardown before showing Disconnected.</p><div class=\"spacer\"></div><div class=\"footer-actions\"><button class=\"btn outline\" data-action=\"stopping\" disabled>Disconnecting…</button></div>","back":"","active":"home","grandma":false,"connected":false,"sources":["android/feature/home/src/main/kotlin/org/kurdistanvpn/feature/home/HomeScreen.kt"],"sheet":""},{"id":"home-failed","name":"Home · Connection failed safely","group":"Connection","html":"<h1 class=\"page-title\">Connection failed<br>safely</h1><span class=\"state-tag err\"><span class=\"dot\"></span>No active VPN session</span><div style=\"height:28px\"></div><dl class=\"data-list\"><div class=\"data-row\"><dt>Profile</dt><dd>Home</dd></div><div class=\"data-row\"><dt>Failure category</dt><dd>Network</dd></div><div class=\"data-row\"><dt>Automatic attempts</dt><dd>Signed retry limit reached</dd></div></dl><div class=\"spacer\"></div><div class=\"note warn\"><svg class=\"\" data-icon=\"info\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"></svg><div><strong>Retry requires valid authority</strong>Review the connection before trying again. Signature, expiry, and revocation checks are never bypassed.</div></div><div class=\"footer-actions\"><button class=\"btn\" data-action=\"connect\" >Try again</button><button class=\"btn outline\" data-go=\"diagnostics\" >Open privacy-safe diagnostics</button></div>","back":"","active":"home","grandma":false,"connected":false,"sources":["android/feature/home/src/main/kotlin/org/kurdistanvpn/feature/home/HomeScreen.kt"],"sheet":""}];

/* Screen registry and stateful views; presentation only. */
'use strict';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const E=esc;
const I=name=>`<svg data-icon="${E(name)}" viewBox="0 0 24 24" aria-hidden="true"></svg>`;
const B=(label,action,kind='outline',value='')=>`<button class="btn ${kind}" data-action="${E(action)}" data-value="${E(value)}">${E(label)}</button>`;
const G=(label,id,kind='outline')=>`<button class="btn ${kind}" data-go="${E(id)}">${E(label)}</button>`;
const N=(label,id,sub='',ico='',value='')=>`<button class="row setting-row" data-go="${E(id)}">${ico?I(ico):''}<span class="row-text"><span class="label">${E(label)}</span>${sub?`<span class="description">${E(sub)}</span>`:''}</span>${value?`<span class="value">${E(value)}</span>`:''}${I('chevron')}</button>`;
const A=(label,action,sub='',value='')=>`<button class="row" data-action="${E(action)}" data-value="${E(value)}"><span class="row-text"><span class="label">${E(label)}</span>${sub?`<span class="description">${E(sub)}</span>`:''}</span>${I('chevron')}</button>`;
const T=(label,key,on,sub='',namespace='pref')=>`<div class="interface-primary"><div class="row-text"><div class="label">${E(label)}</div>${sub?`<div class="description">${E(sub)}</div>`:''}</div><button class="switch-hit" role="switch" aria-checked="${!!on}" aria-label="${E(label)}" data-action="toggle-${namespace}" data-value="${E(key)}"><span class="switch"></span></button></div>`;
const H=(title,sub='')=>`<h1 class="page-title">${E(title)}</h1>${sub?`<p class="page-subtitle">${E(sub)}</p>`:''}`;
const NOTE=(text,title='',kind='')=>`<div class="note ${kind}">${I('info')}<div>${title?`<strong>${E(title)}</strong>`:''}${E(text)}</div></div>`;
const D=rows=>`<dl class="data-list">${rows.map(([a,b,mono])=>`<div class="data-row"><dt>${E(a)}</dt><dd${mono?' class="mono"':''}>${E(b)}</dd></div>`).join('')}</dl>`;
const F=(label,key,value='',type='text',placeholder='')=>`<label class="field">${E(label)}<input type="${E(type)}" data-draft="${E(key)}" value="${E(value)}" placeholder="${E(placeholder)}" autocomplete="off" ${type==='number'?'inputmode="numeric"':''}></label>`;
const SEL=(label,key,value,options,namespace='pref')=>`<label class="field">${E(label)}<select data-${E(namespace)}="${E(key)}">${options.map(x=>{const [v,l]=Array.isArray(x)?x:[x,x];return `<option value="${E(v)}"${v===value?' selected':''}>${E(l)}</option>`}).join('')}</select></label>`;
const SEARCH=(id,label,value='')=>`<label class="search">${I('search')}<input id="${E(id)}" data-search="${E(id)}" type="search" aria-label="${E(label)}" placeholder="${E(label)}" value="${E(value)}"></label>`;
const FOOT=html=>`<div class="footer-actions">${html}</div>`;
const SEC=label=>`<div class="eyebrow section-label">${E(label)}</div>`;
const chip=(label,action,value,active)=>`<button class="chip ${active?'selected':''}" data-action="${E(action)}" data-value="${E(value)}" aria-pressed="${!!active}">${E(label)}</button>`;
const pFor=s=>s.profiles.find(p=>p.id===s.inspected)||KurdState.active(s)||KurdState.initial().profiles[0];
const connected=s=>s.session.status.startsWith('ACTIVE');
const duration=s=>{if(!connected(s))return '—';const n=Math.floor((Date.now()-s.session.started)/1000);return [Math.floor(n/3600),Math.floor(n/60)%60,n%60].map(x=>String(Math.max(0,x)).padStart(2,'0')).join(':')};
const ROUTES=new Map(SCREENS.map(x=>[x.id,{...x,title:x.name.split(' · ').slice(1).join(' · ')||x.name,source:'bundle',render:()=>x.html}]));
function page(id,title,parent,group,render,source='prototype'){ROUTES.set(id,{...(ROUTES.get(id)||{}),id,name:title,title,back:parent,group,active:group==='Profiles'||group==='Setup'||group==='Trust'?'profiles':group==='Connection'?'home':'settings',grandma:id.startsWith('grandma-'),source,render});}
function homeHTML(s,u){
 const p=KurdState.active(s);if(!p)return ROUTES.get('home-empty').render(s,u);
 const q=s.session.status,on=connected(s),busy=['CONNECTING','RECONNECTING','RECOVERING','FALLING_BACK','STOPPING'].includes(q);
 const title={IDLE:'Disconnected',CONNECTING:'Connecting…',ACTIVE_KURD_LIVE:'Connected',ACTIVE_KURD_LOOPBACK:'Local test',RECONNECTING:'Reconnecting…',FALLING_BACK:'Selecting fallback…',BLOCKED:'Blocked',FAILED:'Connection failed',REVOKED:'Permission revoked',DEGRADED:'Degraded',RECOVERING:'Recovering…',STOPPING:'Disconnecting…'}[q]||'Disconnected';
 const detail=on?(s.session.local?'Connected to owned loopback':'Connected through verified Kurd relay'):busy?(q==='RECONNECTING'?`Fresh authority · attempt ${s.session.attempt} of 3`:'Validating the signed Kurd session'):q==='IDLE'?'No active VPN connection':(s.session.failure||'A secure session could not be established').replaceAll('_',' ').toLowerCase();
 return `<div class="hero compact"><div class="eyebrow">VPN state</div><div class="hero-state"><h1 style="font-size:${title.length>17?32:40}px">${E(title)}</h1>${busy?'<span class="busy-ring" aria-label="Working"></span>':`<button class="switch-hit" role="switch" aria-checked="${on}" aria-label="VPN connection" data-action="connection-toggle"><span class="switch"></span></button>`}</div><div class="status-copy ${on?'positive':q==='IDLE'?'':'warning'}"><span class="dot"></span>${E(detail)}</div></div>
 <button class="home-node" data-go="profiles"><div><div class="eyebrow" style="margin-bottom:8px">Active Kurd profile</div><div class="node-label">${E(p.alias)}</div><div class="node-subtitle">Generation ${p.generation} · ${p.condition==='valid'?'verified local authority':E(p.condition)}</div></div>${I('chevron')}</button>
 <button class="path-button" data-go="session-plan" aria-label="Open signed connection path"><div class="network-path ${on?'live':''}"><div class="path-stop path-start">${I('phone')}<span class="path-label">This device</span></div><div class="path-line"></div><div class="path-stop">${I('connection')}<span class="path-label">Kurd</span></div><div class="path-line"></div><div class="path-stop path-end">${I('nodes')}<span class="path-label">${s.session.local?'Test relay':'Your relay'}</span></div></div></button>
 <div class="metrics"><div class="metric"><div class="metric-label">Connected duration</div><div class="metric-value mono" data-duration>${duration(s)}</div></div><div class="metric"><div class="metric-label">Profile generation</div><div class="metric-value mono">${p.generation}</div></div></div>
 <button class="compact-detail" data-go="connection-details"><span class="detail-text"><span>Protocol: Kurd</span><span class="sep"></span><span class="muted">Signed session plan</span></span>${I('chevron')}</button>
 ${on&&s.session.local?NOTE('This local test does not provide Internet access.'):['BLOCKED','FAILED','REVOKED'].includes(q)?N('Review what happened',q==='REVOKED'?'vpn-consent':p.condition==='expired'?'profile-expired':p.condition==='revoked'?'profile-revoked':s.storage!=='ready'?'recovery':'troubleshooting','','info'):''}
 <div class="edition-note">${on?'Simulated session · no Internet traffic is routed.':'Browser prototype · no network operations.'}</div>
 ${FOOT(on?B(s.session.local?'Stop local test':'Disconnect','disconnect'):busy?B('Cancel','cancel-connect'):B('Connect','connect',''))}`;
}
for(const id of SCREENS.filter(x=>x.id.startsWith('home-')&&x.id!=='home-empty').map(x=>x.id))ROUTES.get(id).render=homeHTML;
page('profiles','Profiles','','Profiles',(s,u)=>{

function gmDiagnosis(s) {

function openProfileMenu() {
 if(modalResolve)closeModal(false);
 modalOpener=document.activeElement;device.querySelector('.app-screen').inert=true;
 const layer=document.createElement('div');layer.className='modal-layer profile-add-sheet';
 const choices=[['Add verified profile','Choose a profile file','file','import-file'],['Import from link','Preview a kurd:// link','connection','import-link'],['Scan QR','Scan an offline profile code','qr','scan-qr'],['Paste profile data','Paste explicitly, then verify','file','import-link']];
 layer.innerHTML=`<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="add-profile-title"><div class="modal-grip"></div><h2 id="add-profile-title">Add profile</h2><p>Nothing is saved until you check and confirm it.</p>${choices.map(([a,b,c,d])=>`<button class="profile-add-option" data-action="profile-import-choice" data-value="${d}">${I(c)}<span>${E(a)}<small>${E(b)}</small></span>${I('chevron')}</button>`).join('')}<button class="all-imports" data-action="profile-import-choice" data-value="import-methods">All import options & device enrollment</button><button class="btn outline" data-action="modal-cancel">Cancel</button></div>`;
 device.append(layer);modalResolve=()=>{};iconFill(layer);layer.querySelector('button').focus();
}
function seedNimbaha() {
 const ids=new Set(app.profiles.map(p=>p.id));
 const additions=ProfileView.fixtures(20).filter(p=>!ids.has(p.id));
 app.profiles.push(...additions);store();return additions.length;
}

};

 for(const name of new Set(app.profiles.map(p=>p.provider||'On this device'))) {

 }

}

HANDLERS['expand-profile-groups']=()=>{setAllGroups(false);navTo('profiles')};

HANDLERS['profile-sort']=(el,value)=>{if(!['original','name','generation'].includes(value))return;ui.profileSort=value;profilePreferences.sort=value;saveProfilePreferences();render(true)};
HANDLERS['clear-profile-search']=()=>{ui.search['profile-search']='';const input=device.querySelector('#profile-search');if(input){input.value='';searchProfiles();input.focus();}};

HANDLERS['open-profile-group']=(el,name)=>{ui.profileGroup=name;ui.provider=name;navTo('profile-group')};
HANDLERS['refresh-profile-group']=async(el,name)=>{
 name=name||ui.profileGroup||'Nimbaha';if(profileUI.syncing.has(name))return;
 profileUI.syncing.add(name);render(true);
 await new Promise(resolve=>setTimeout(resolve,app.settings.reducedMotion?40:850));
 profileUI.syncing.delete(name);profileUI.refresh[name]=Date.now();
 eventLog('Info','Profiles','A synthetic group update review completed; no network request or profile replacement.');render(true);
 toast('Demo review complete. No network update was fetched. Profiles are unchanged.');
};
HANDLERS['seed-nimbaha']=()=>{const n=seedNimbaha();navTo('profiles');toast(n?'Added the 20-profile Nimbaha demonstration group.':'The Nimbaha demo group is already present.')};
const previousFilter=HANDLERS['filter-profiles'];
HANDLERS['filter-profiles']=(el,value)=>{profileUI.scroll=0;return previousFilter(el,value)};
const previousToggle=HANDLERS['toggle-pref'];
HANDLERS['toggle-pref']=(el,key)=>{if(key==='grandma'&&app.settings.grandma){navTo('grandma-exit');return}return previousToggle(el,key)};
HANDLERS['grandma-import']=()=>{app.settings.grandma=true;ui.trust=false;ui.candidate=null;store();navTo('grandma-setup')};
// The existing demo reset is still available, but is no longer an accidental setup shortcut.
HANDLERS['grandma-demo']=async()=>{if(!await ask('Use example setup?','This replaces only the browser demonstration data with its original examples. It does not touch your installed app.','Use demo examples'))return;cancelSessionTimer();app=KurdState.initial();app.settings.grandma=true;store();navTo('grandma-home')};
HANDLERS['gm-use-imported']=()=>{const id=ui.candidate?.id||app.inspected;if(!app.profiles.some(p=>p.id===id))return;app.inspected=id;return HANDLERS['use-profile']()};
HANDLERS['gm-save-support']=async()=>{if(await ask('Save information for your helper?','Only the safe demo summary will be saved on this device. Nothing is sent to anyone.','Save summary'))return HANDLERS['export-diagnostics']()};
const previousRename=HANDLERS['save-alias'];
HANDLERS['save-alias']=()=>previousRename();
/* A compact legacy view is kept available through its original route, without any loss of actions. */
const previousNavTo=navTo;
navTo=function(id,options={}){
 if(id.startsWith('grandma-')&&!app.settings.grandma){app.settings.grandma=true;store();}
 return previousNavTo(id,options);
};
const baseRender=render;
render=function(preserve=false){
 const active=document.activeElement;
 const focus=preserve&&device.contains(active)?{key:active.dataset.focusKey,id:active.id,start:active.selectionStart,end:active.selectionEnd}:null;
 baseRender(preserve);
 if(focus&&!device.querySelector('.modal-layer')) {
  const target=focus.key?[...device.querySelectorAll('[data-focus-key]')].find(x=>x.dataset.focusKey===focus.key):focus.id?device.querySelector('#'+CSS.escape(focus.id)):null;
  if(target){target.focus({preventScroll:true});if(typeof target.setSelectionRange==='function'&&typeof focus.start==='number'){try{target.setSelectionRange(focus.start,focus.end)}catch{}}}
 }
};
const retainedSnapshot=KurdDemo.snapshot;
Object.assign(KurdDemo, {
 go:id=>navTo(id,{raw:true}),render,
 addSampleGroup:()=>{seedNimbaha();render(true)},
 profileView:()=>profileView(app,ui),
 presentation:()=>JSON.parse(JSON.stringify(profilePreferences)),
 refinements:'Profiles + Grandma Mode / v2'
});
// Add the requested named group once, without replacing any existing profile or setting.
try {
 if(!localStorage.getItem('kurdistan-v2-nimbaha-example')&&app.profiles.length){seedNimbaha();localStorage.setItem('kurdistan-v2-nimbaha-example','yes');}
} catch {if(app.profiles.length&&app.profiles.length<=3)seedNimbaha();}
const panelFoot=document.querySelector('.panel-foot');
const sampleButton=document.createElement('button');sampleButton.dataset.action='seed-nimbaha';sampleButton.textContent='Sample group';panelFoot.append(sampleButton);
const panelTitle=document.querySelector('.panel h1');panelTitle.innerHTML='Compact profiles.<br>Simple everyday use.';
const panelDescription=document.querySelector('.panel p');panelDescription.textContent='The complete app, with grouped Profiles and a clearer Grandma Mode. Every change stays in this browser demonstration.';
buildExplorer();

if(!firstHash){ui.route='profiles';history.replaceState({route:'profiles',depth:0},'','#profiles');}
render();

<script id="flag-theme-upgrade-script">
(function(){
  const makeSunSVG = () => {
    const rays = [];
    const count = 21, inner = 22, outer = 46, spread = Math.PI / 21;
    for (let i = 0; i < count; i++) {
      const a = -Math.PI / 2 + i * (Math.PI * 2 / count);
      const a1 = a - spread / 2.8, a2 = a + spread / 2.8;
      const x1 = Math.cos(a1) * inner, y1 = Math.sin(a1) * inner;
      const x2 = Math.cos(a2) * inner, y2 = Math.sin(a2) * inner;
      const xo = Math.cos(a) * outer, yo = Math.sin(a) * outer;
      rays.push(`<polygon class="sun-ray" style="--i:${i}" points="${x1.toFixed(2)},${y1.toFixed(2)} ${xo.toFixed(2)},${yo.toFixed(2)} ${x2.toFixed(2)},${y2.toFixed(2)}"></polygon>`);
    }
    return `<svg class="kurd-sun-svg" viewBox="-56 -56 112 112" aria-hidden="true"><g class="sun-rays">${rays.join('')}</g><circle class="sun-core" cx="0" cy="0" r="20"></circle></svg>`;
  };
  const homeSunButton = (state, action='connection-toggle') => `<button class="sun-control ${state==='on'?'is-on':state==='connecting'?'is-connecting':state==='error'?'is-error':'is-off'}" role="switch" aria-checked="${state==='on'}" aria-label="VPN connection" data-action="${action}">${makeSunSVG()}</button>`;
  const grandmaSunAction = (state, label, note, attrName, attrValue) => `<button class="gm-sun-action ${state==='on'?'is-on':'is-off'}" ${attrName}="${attrValue}"><span class="gm-sun-inline">${makeSunSVG()}</span><span class="gm-sun-copy"><span class="gm-sun-label">${label}</span><span class="gm-sun-note">${note}</span></span></button>`;
  function setRouteClass(){
    const screen = document.querySelector('.app-screen');
    if (!screen) return;
    screen.classList.remove('route-home','route-profiles','route-settings');
    const active = screen.querySelector('.bottom-nav button.active');
    if (active && active.dataset.go) screen.classList.add('route-' + active.dataset.go);
  }
  function upgradeHomeButtons(){
    const id = device.dataset.screen;
    const main = device.querySelector('.screen-main');
    if (!main) return;
    const stateMap = {
      'home-connected':'on','home-fallback':'on','home-loopback':'on',
      'home-connecting':'connecting','home-reconnecting':'connecting','home-recovering':'connecting','home-degraded':'connecting',
      'home-blocked':'error','home-failed':'error','home-disconnected':'off','home-stopping':'off'
    };
    const state = stateMap[id];
    main.querySelectorAll('button.switch-hit[data-action="connection-toggle"]').forEach(btn => {
      btn.outerHTML = homeSunButton(state || (btn.getAttribute('aria-checked') === 'true' ? 'on' : 'off'));
    });
    main.querySelectorAll('.network-path .path-stop').forEach((stop, index) => {
      const label = stop.querySelector('.path-label')?.textContent?.trim();
      if (index === 1 && label === 'Kurd') {
        stop.classList.add('kurd-stop');
        const on = stop.closest('.network-path')?.classList.contains('live');
        const stateClass = on ? 'is-on' : 'is-off';
        const existing = stop.querySelector('svg,.path-sun');
        if (existing && !stop.querySelector('.path-sun')) {
          existing.outerHTML = `<span class="path-sun ${stateClass}">${makeSunSVG()}</span>`;
        }
      }
    });
  }
  function upgradeGrandmaMode(){
    const id = device.dataset.screen;
    if (!id.startsWith('grandma-')) return;
    const main = device.querySelector('.screen-main');
    if (!main) return;
    const hero = main.querySelector('.gm-hero');
    const stateMap = {'grandma-on':'on','grandma-loopback':'on','grandma-off':'off','grandma-reconnecting':'connecting','grandma-attention':'error'};
    const state = stateMap[id] || 'off';
    if (hero && !hero.querySelector('.gm-sun-holder')) {
      const div = document.createElement('div');
      div.className = 'gm-sun-holder';
      div.innerHTML = `<div class="gm-sun-badge ${state==='on'?'is-on':state==='connecting'?'is-connecting':state==='error'?'is-error':'is-off'}">${makeSunSVG()}</div>`;
      hero.prepend(div);
    }
    const bottom = main.querySelector('.gm-bottom');
    if (!bottom) return;
    const connect = bottom.querySelector('.btn[data-action="grandma-connect"]');
    if (connect && !bottom.querySelector('.gm-sun-action')) {
      connect.classList.add('replaced');
      bottom.insertAdjacentHTML('afterbegin', grandmaSunAction('off', connect.textContent.trim(), 'Tap the sun to turn protection on.', 'data-action', 'grandma-connect'));
    }
    const disconnect = bottom.querySelector('.btn[data-go="grandma-disconnect"]');
    if (disconnect && !bottom.querySelector('.gm-sun-action')) {
      disconnect.classList.add('replaced');
      bottom.insertAdjacentHTML('afterbegin', grandmaSunAction('on', disconnect.textContent.trim(), 'Tap the sun to stop the VPN safely.', 'data-go', 'grandma-disconnect'));
    }
    const stopTest = bottom.querySelector('.btn[data-action="disconnect"]');
    if (stopTest && !bottom.querySelector('.gm-sun-action')) {
      stopTest.classList.add('replaced');
      bottom.insertAdjacentHTML('afterbegin', grandmaSunAction('on', stopTest.textContent.trim(), 'Tap the sun to stop this local test.', 'data-action', 'disconnect'));
    }
  }
  function polishSemantics(){
    document.querySelectorAll('.btn').forEach(btn => {
      const t = (btn.textContent || '').trim().toLowerCase();
      if (/delete|remove|turn vpn off|stop test|leave grandma mode/.test(t)) btn.classList.add('outline');
      if (/reset all|delete permanently/.test(t)) btn.classList.add('danger');
    });
  }
  const baseRender = render;
  render = function(preserve=false){
    baseRender(preserve);
    setRouteClass();
    upgradeHomeButtons();
    upgradeGrandmaMode();
    polishSemantics();
  };
  setRouteClass();
  upgradeHomeButtons();
  upgradeGrandmaMode();
  polishSemantics();
})();
</script>
