name: Publish website

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/website-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Install isolated browser QA tools
        working-directory: website
        run: |
          npm install --prefix "$RUNNER_TEMP/website-qa" --no-package-lock --ignore-scripts playwright@1.62.1 axe-core@4.13.0
          "$RUNNER_TEMP/website-qa/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/website-qa/node_modules/playwright" >> "$GITHUB_ENV"
          echo "AXE_SOURCE=$RUNNER_TEMP/website-qa/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"

      - name: Check publication boundary
        working-directory: website
        run: node scripts/publication-boundary.mjs

      - name: Run complete quality check
        working-directory: website
        run: npm run verify

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build GitHub Pages artifact
        working-directory: website
        env:
          SITE_URL: https://saroo98.github.io/kurdistan-protocol-compiler/
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
