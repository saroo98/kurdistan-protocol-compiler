name: Website quality

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website-quality.yml'
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/website-quality.yml'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install isolated browser QA tools
        run: |
          npm install --prefix "$RUNNER_TEMP/website-qa" --no-package-lock --ignore-scripts playwright@1.62.1 axe-core@4.13.0
          "$RUNNER_TEMP/website-qa/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/website-qa/node_modules/playwright" >> "$GITHUB_ENV"
          echo "AXE_SOURCE=$RUNNER_TEMP/website-qa/node_modules/axe-core/axe.min.js" >> "$GITHUB_ENV"

      - name: Check publication boundary
        run: node scripts/publication-boundary.mjs

      - name: Run complete quality check
        run: npm run verify

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: website/qa
          retention-days: 14
