name: Unsigned engineering candidate

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact certified commit SHA
        required: true
        type: string
      assurance_run_id:
        description: Successful Phase 16 assurance workflow run ID
        required: true
        type: string
      assurance_run_attempt:
        description: Exact successful Phase 16 assurance workflow attempt
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  GOTELEMETRY: 'off'

concurrency:
  group: engineering-candidate-${{ inputs.sha }}
  cancel-in-progress: true

jobs:
  verify-assurance:
    name: verify exact-subject assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require current trusted main subject
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -cne 'refs/heads/main') { throw 'candidate workflow must be dispatched from main' }
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $main = (git rev-parse refs/remotes/origin/main).Trim()
          if ($main -cne '${{ inputs.sha }}') { throw "candidate subject ${{ inputs.sha }} is not current origin/main $main" }
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Authenticate assurance run provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ('${{ inputs.sha }}' -notmatch '^[0-9a-f]{40}$') { throw 'sha must be exactly 40 lowercase hex characters' }
          if ('${{ inputs.assurance_run_id }}' -notmatch '^[1-9][0-9]{0,19}$') { throw 'assurance_run_id is invalid' }
          if ('${{ inputs.assurance_run_attempt }}' -notmatch '^[1-9][0-9]{0,5}$') { throw 'assurance_run_attempt is invalid' }
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ inputs.assurance_run_id }}/attempts/${{ inputs.assurance_run_attempt }}"
          $run = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers
          $workflow = Invoke-RestMethod -Method Get -Uri $run.workflow_url -Headers $headers
          if ($run.repository.full_name -cne '${{ github.repository }}') { throw 'assurance run repository mismatch' }
          if ([string]$run.id -cne '${{ inputs.assurance_run_id }}' -or [int]$run.run_attempt -ne [int]'${{ inputs.assurance_run_attempt }}') { throw 'assurance run identity mismatch' }
          if ($run.status -cne 'completed' -or $run.conclusion -cne 'success') { throw 'assurance run is not successfully completed' }
          if ($run.head_sha -cne '${{ inputs.sha }}' -or $run.head_branch -cne 'main') { throw 'assurance run did not validate the requested main commit' }
          if ($workflow.path -cne '.github/workflows/assurance.yml') { throw "unexpected assurance workflow $($workflow.path)" }
          if ($run.event -cne 'push' -and $run.event -cne 'workflow_dispatch') { throw "unexpected assurance trigger $($run.event)" }
          New-Item -ItemType Directory -Force .tools | Out-Null
          [ordered]@{
            schema = 'kpc-authenticated-assurance-run-v1'
            repository = $run.repository.full_name
            runId = [string]$run.id
            runAttempt = [int]$run.run_attempt
            workflowPath = $workflow.path
            event = $run.event
            headBranch = $run.head_branch
            headSha = $run.head_sha
            status = $run.status
            conclusion = $run.conclusion
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath .tools/assurance-run.json -Encoding utf8NoBOM
      - name: Download portable assurance bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          run-id: ${{ inputs.assurance_run_id }}
          github-token: ${{ github.token }}
          name: shadow-certificate-${{ inputs.assurance_run_id }}-${{ inputs.assurance_run_attempt }}
          path: .tools/verified-assurance
      - name: Validate portable bundle against requested commit and tree
        shell: pwsh
        run: |
          $run = Get-Content -LiteralPath .tools/assurance-run.json -Raw | ConvertFrom-Json
          $certificate = Get-Item -LiteralPath .tools/verified-assurance/assurance-certificate.json
          $receipts = @(Get-ChildItem -LiteralPath .tools/verified-assurance/receipts -Filter '*-receipt.json' -File)
          if ($receipts.Count -ne 16) { throw "expected 16 receipts, found $($receipts.Count)" }
          $inventories = @(Get-ChildItem -LiteralPath .tools/verified-assurance/inventories -Filter 'emulator-api*-identity.json' -File)
          if ($inventories.Count -ne 3) { throw "expected three emulator identity inventories, found $($inventories.Count)" }
          $tree = (git rev-parse '${{ inputs.sha }}^{tree}').Trim()
          go run ./cmd/assure certificate validate `
            -root . `
            -certificate .tools/verified-assurance/assurance-certificate.json `
            -receipts-root .tools/verified-assurance `
            -inventories-root .tools/verified-assurance/inventories `
            -expected-repository '${{ github.repository }}' `
            -expected-commit '${{ inputs.sha }}' `
            -expected-tree $tree `
            -expected-run-id '${{ inputs.assurance_run_id }}' `
            -expected-run-attempt '${{ inputs.assurance_run_attempt }}' `
            -expected-trigger $run.event `
            -expected-workflow-path .github/workflows/assurance.yml `
            -expected-workflow-source-commit '${{ inputs.sha }}' `
            -required android-device-api26 `
            -required android-device-api34 `
            -required android-device-api36 `
            -required android-host `
            -required dependency-freshness `
            -required docs-evidence `
            -required go-audit `
            -required go-core `
            -required go-executable-evidence `
            -required linux-netns `
            -required operator
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath .tools/assurance-run.json -Destination .tools/verified-assurance/assurance-run.json
      - name: Upload authenticated assurance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: verified-assurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tools/verified-assurance/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  build:
    name: clean candidate build ${{ matrix.builder }}
    needs: verify-assurance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        builder: [a, b]
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.tools/gradle-${{ matrix.builder }}
    steps:
      - name: Check out exact subject
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Set up Android
        uses: ./.github/actions/setup-android
      - name: Build clean unsigned engineering candidate
        working-directory: android
        run: >-
          ./gradlew ciEngineeringCandidate
          --no-build-cache
          --no-configuration-cache
          --rerun-tasks
      - name: Normalize deterministic SBOM and refresh candidate metadata
        shell: pwsh
        run: |
          $bomPath = 'android/build/reports/cyclonedx/bom.json'
          $bom = Get-Content -LiteralPath $bomPath -Raw | ConvertFrom-Json
          if ($null -eq $bom.metadata.timestamp) { throw 'CycloneDX metadata timestamp is missing' }
          $bom.metadata.PSObject.Properties.Remove('timestamp')
          $bom | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $bomPath -Encoding utf8NoBOM
          go run ./cmd/releaseverify -root . `
            -artifact-subject UNSIGNED_ENGINEERING_CANDIDATE `
            -artifact-metadata android/build/ci/engineering-candidate.json `
            -artifact unsigned-apk=android/app/build/outputs/apk/release/*.apk `
            -artifact unsigned-aab=android/app/build/outputs/bundle/release/*.aab `
            -artifact mapping=android/app/build/outputs/mapping/release/mapping.txt `
            -artifact native-debug-symbols=android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip `
            -artifact cyclonedx-sbom=android/build/reports/cyclonedx/bom.json `
            -artifact license-evidence=testdata/evidence/phase9/android-licenses.spdx.json `
            -artifact merged-manifest=android/app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml `
            -artifact release-products=config/release/products.json `
            -artifact release-version=config/release/version.properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload exact candidate bytes and metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: candidate-builder-${{ matrix.builder }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
            android/app/build/intermediates/merged_manifest/release/processReleaseMainManifest/AndroidManifest.xml
            android/build/reports/cyclonedx/bom.json
            android/build/ci/engineering-candidate.json
            config/release/products.json
            config/release/version.properties
            testdata/evidence/phase9/android-licenses.spdx.json
          if-no-files-found: error
          retention-days: 14

  compare:
    name: reproducibility comparison
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact trusted subject tooling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Download both independent candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          pattern: candidate-builder-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidates
      - name: Download authenticated assurance bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.3.0
        with:
          name: verified-assurance-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-assurance
      - name: Compare every produced byte
        shell: pwsh
        run: |
          $a = Get-ChildItem -LiteralPath candidates -Directory | Where-Object Name -Like 'candidate-builder-a-*'
          $b = Get-ChildItem -LiteralPath candidates -Directory | Where-Object Name -Like 'candidate-builder-b-*'
          if ($a.Count -ne 1 -or $b.Count -ne 1) { throw 'candidate A/B directories are incomplete' }
          $filesA = Get-ChildItem -LiteralPath $a.FullName -File -Recurse | ForEach-Object {
            [ordered]@{
              path = [System.IO.Path]::GetRelativePath($a.FullName, $_.FullName).Replace('\', '/')
              size = $_.Length
              sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          } | Sort-Object path
          $filesB = Get-ChildItem -LiteralPath $b.FullName -File -Recurse | ForEach-Object {
            [ordered]@{
              path = [System.IO.Path]::GetRelativePath($b.FullName, $_.FullName).Replace('\', '/')
              size = $_.Length
              sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          } | Sort-Object path
          $left = $filesA | ConvertTo-Json -Depth 3 -Compress
          $right = $filesB | ConvertTo-Json -Depth 3 -Compress
          if ($left -cne $right) {
            Write-Host 'candidate A:' $left
            Write-Host 'candidate B:' $right
            throw 'independent candidate outputs are not byte-identical'
          }
          $filesA | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath candidate-comparison.json -Encoding utf8NoBOM
          $certificate = Get-Item -LiteralPath verified-assurance/assurance-certificate.json
          $certificateDigest = (Get-FileHash -LiteralPath $certificate.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $run = Get-Content -LiteralPath verified-assurance/assurance-run.json -Raw | ConvertFrom-Json
          $tree = (Get-Content -LiteralPath $certificate.FullName -Raw | ConvertFrom-Json).subject.tree
          $receiptDigests = Get-ChildItem -LiteralPath verified-assurance/receipts -Filter '*-receipt.json' -File | Sort-Object Name | ForEach-Object {
            [ordered]@{ path = "receipts/$($_.Name)"; size = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          $inventoryDigests = Get-ChildItem -LiteralPath verified-assurance/inventories -Filter 'emulator-api*-identity.json' -File | Sort-Object Name | ForEach-Object {
            [ordered]@{ path = $_.Name; size = $_.Length; sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          }
          if ($inventoryDigests.Count -ne 3) { throw "expected three emulator identity inventories, found $($inventoryDigests.Count)" }
          [ordered]@{
            schema = 'kpc-engineering-candidate-provenance-v1'
            repository = '${{ github.repository }}'
            commit = '${{ inputs.sha }}'
            tree = $tree
            assurance = [ordered]@{
              runId = [string]$run.runId
              runAttempt = [int]$run.runAttempt
              trigger = $run.event
              workflowPath = $run.workflowPath
              certificatePath = 'assurance-certificate.json'
              certificateSha256 = $certificateDigest
              receipts = @($receiptDigests)
              inventories = @($inventoryDigests)
            }
            selectedBuilder = 'a'
            selectedArtifacts = @($filesA)
            comparisonSha256 = (Get-FileHash -LiteralPath candidate-comparison.json -Algorithm SHA256).Hash.ToLowerInvariant()
            authoritative = $false
            limitations = @('unsigned engineering candidate; signing, upload, promotion, and release remain unauthorized')
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath candidate-provenance.json -Encoding utf8NoBOM
          $candidateRoot = [System.IO.Path]::GetRelativePath((Get-Location).Path, $a.FullName).Replace('\', '/')
          go run ./cmd/assure candidate validate -root . -provenance candidate-provenance.json -candidate-root $candidateRoot -assurance-root verified-assurance -comparison candidate-comparison.json -expected-repository '${{ github.repository }}' -expected-commit '${{ inputs.sha }}' -expected-tree $tree -expected-run-id '${{ inputs.assurance_run_id }}' -expected-run-attempt '${{ inputs.assurance_run_attempt }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload selected unsigned engineering candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: unsigned-engineering-candidate-${{ inputs.sha }}
          path: |
            candidates/candidate-builder-a-*/**
            candidate-comparison.json
            candidate-provenance.json
            verified-assurance/**
          if-no-files-found: error
          retention-days: 30
