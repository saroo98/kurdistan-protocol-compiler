name: Phase 16 portable recovery drills

on:
  workflow_dispatch:
    inputs:
      drill:
        description: Deterministic local drill
        required: true
        type: choice
        options: [state-loss, interrupted-write, authority-rollback, issuer-loss, backup-tamper]

permissions:
  contents: read

concurrency:
  group: phase16-portable-drill
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Execute isolated self-hosting drill
        env:
          DRILL: ${{ inputs.drill }}
        shell: bash
        run: |
          case "$DRILL" in
            state-loss) TEST='TestEncryptedBackupRestoreAndRollbackProtection' ;;
            interrupted-write) TEST='TestInterruptedStateWriteResidueCannotReplaceCommittedState' ;;
            authority-rollback) TEST='TestClockRollbackAndLargeForwardJumpFailClosed' ;;
            issuer-loss) TEST='TestIssuerAndRelayRotationRevokePriorProfiles' ;;
            backup-tamper) TEST='TestBackupRejectsWrongPassphraseTamperAndUnsafePaths' ;;
            *) echo "unsupported drill" >&2; exit 2 ;;
          esac
          LISTED=$(go test ./internal/selfhost -list "^${TEST}$")
          [ "$LISTED" = "$TEST" ] || { echo "expected drill test is absent: $TEST" >&2; exit 1; }
          go test -count=1 ./internal/selfhost -run "^${TEST}$"
