name: Phase 16 qualification

on:
  pull_request:
    paths:
      - 'production/**'
      - 'infra/terraform/**'
      - 'config/production/**'
      - 'cmd/phase16verify/**'
      - '.github/workflows/phase16-*.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTELEMETRY: 'off'
  TF_IN_AUTOMATION: 'true'

jobs:
  local-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Verify both Go modules
        run: |
          go run ./cmd/phase16verify -root . -mode offline
          go -C production mod verify
          go -C production test -count=1 ./...
          go -C production vet ./...
      - name: Install pinned Terraform
        shell: bash
        run: |
          set -euo pipefail
          version=1.15.8
          base="https://releases.hashicorp.com/terraform/${version}"
          curl --fail --silent --show-error --location --output terraform.zip "${base}/terraform_${version}_linux_amd64.zip"
          curl --fail --silent --show-error --location --output SHA256SUMS "${base}/terraform_${version}_SHA256SUMS"
          grep " terraform_${version}_linux_amd64.zip$" SHA256SUMS | sha256sum --check --strict
          unzip -q terraform.zip -d .tools/phase16/bin
      - name: Validate qualification and production configuration
        shell: bash
        run: |
          set -euo pipefail
          tf="$PWD/.tools/phase16/bin/terraform"
          "$tf" -chdir=infra/terraform fmt -check -recursive
          "$tf" -chdir=infra/terraform/environments/qualification init -backend=false -lockfile=readonly
          "$tf" -chdir=infra/terraform/environments/qualification validate
          rm -rf infra/terraform/environments/qualification/.terraform
          "$tf" -chdir=infra/terraform/environments/production init -backend=false -lockfile=readonly
          "$tf" -chdir=infra/terraform/environments/production validate
