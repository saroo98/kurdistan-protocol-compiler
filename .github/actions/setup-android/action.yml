name: Set up pinned Android toolchain
description: Installs the repository JDK and declared Android SDK components.

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle
    - name: Install pinned Android SDK components on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
          "platforms;android-36" \
          "build-tools;36.0.0" \
          "ndk;28.2.13676358" \
          "cmake;3.22.1"
    - name: Install pinned Android SDK components on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" `
          "platforms;android-36" `
          "build-tools;36.0.0" `
          "ndk;28.2.13676358" `
          "cmake;3.22.1"
